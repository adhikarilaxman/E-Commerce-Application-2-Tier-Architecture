apiVersion: v1
kind: ServiceAccount
metadata:
  name: filebeat
  namespace: ecommerce

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: filebeat
rules:
  - apiGroups: [""]
    resources:
      - namespaces
      - pods
      - nodes
    verbs:
      - get
      - list
      - watch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: filebeat
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: filebeat
subjects:
  - kind: ServiceAccount
    name: filebeat
    namespace: ecommerce

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: filebeat-config
  namespace: ecommerce
data:
  filebeat.yml: |
    filebeat.autodiscover:
      providers:
        - type: kubernetes
          node: ${NODE_NAME}

          templates:
            - condition:
                and:
                  - equals:
                      kubernetes.namespace: ecommerce
                  - or:
                      - equals:
                          kubernetes.container.name: frontend
                      - equals:
                          kubernetes.container.name: backend

              config:
                - type: filestream
                  id: kubernetes-${data.kubernetes.pod.uid}-${data.kubernetes.container.id}

                  prospector.scanner.symlinks: true

                  parsers:
                    - container: ~

                  paths:
                    - /var/log/containers/*-${data.kubernetes.container.id}.log

                  close.on_state_change.removed: false

    processors:
      - add_kubernetes_metadata:
          host: ${NODE_NAME}

    output.elasticsearch:
      hosts:
        - "http://elasticsearch:9200"

    setup.kibana:
      host: "http://kibana:5601"

---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: filebeat
  namespace: ecommerce
spec:
  selector:
    matchLabels:
      app: filebeat

  template:
    metadata:
      labels:
        app: filebeat

    spec:
      serviceAccountName: filebeat

      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet

      securityContext:
        runAsUser: 0

      containers:
        - name: filebeat
          image: docker.elastic.co/beats/filebeat:8.19.6

          args:
            - "-e"
            - "--strict.perms=false"

          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName

          securityContext:
            privileged: true

          resources:
            requests:
              memory: "100Mi"
              cpu: "100m"
            limits:
              memory: "300Mi"
              cpu: "300m"

          volumeMounts:
            - name: config
              mountPath: /usr/share/filebeat/filebeat.yml
              subPath: filebeat.yml
              readOnly: true

            - name: containers
              mountPath: /var/log/containers
              readOnly: true

            - name: pods
              mountPath: /var/log/pods
              readOnly: true

            - name: filebeat-data
              mountPath: /usr/share/filebeat/data

      volumes:
        - name: config
          configMap:
            name: filebeat-config
            defaultMode: 0640

        - name: containers
          hostPath:
            path: /var/log/containers

        - name: pods
          hostPath:
            path: /var/log/pods

        - name: filebeat-data
          hostPath:
            path: /var/lib/filebeat-data
            type: DirectoryOrCreate